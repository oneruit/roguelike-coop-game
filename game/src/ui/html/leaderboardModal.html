      <!-- Leaderboard Modal -->
      <div id="leaderboard-modal" class="modal hidden">
        <div class="modal-backdrop menu-scenic-backdrop" id="leaderboard-backdrop"></div>
        <div class="modal-card leaderboard-card modern-glass-modal">
          <div class="leaderboard-header">
            <div>
              <div class="sub-title menu-badge-blue">ЗАЛ СЛАВЫ</div>
              <h2 class="modern-menu-title" style="font-size: 24px; margin: 4px 0 0 0;">ТАБЛИЦА ЛИДЕРОВ</h2>
            </div>
            <button id="leaderboard-btn-close" class="leaderboard-close-btn" type="button" title="Закрыть">✕</button>
          </div>

          <div class="leaderboard-controls">
            <div class="leaderboard-subtitle">
              Лучшие странники, покорившие Разлом
            </div>
            <button id="leaderboard-btn-refresh" class="leaderboard-refresh-btn" type="button">↻ Обновить</button>
          </div>

          <div class="leaderboard-table-container">

              <thead>
                <tr>
                  <th style="width: 60px;">#</th>
                  <th>Игрок</th>
                  <th>Герой</th>
                  <th>Этап</th>
                  <th>Время</th>
                  <th>Убийства</th>
                  <th style="text-align: right;">Очки</th>
                </tr>
              </thead>
              <tbody id="leaderboard-tbody">

              </tbody>
            </table>
          </div>

          <div class="leaderboard-footer">
            <button id="leaderboard-btn-back" class="action-btn modern-back-btn leaderboard-btn-back" type="button">Назад</button>
          </div>
        </div>
      </div>
