      <!-- Leaderboard Modal -->
      <div id="leaderboard-modal" class="modal hidden">
        <div class="modal-backdrop menu-scenic-backdrop" id="leaderboard-backdrop"></div>
        <div class="modal-card pause-card modern-glass-modal" style="max-width: 780px; width: 92%; padding: 24px;">
          <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; margin-bottom: 16px;">
            <div>
              <div class="sub-title menu-badge-blue">ЗАЛ СЛАВЫ</div>

              Лучшие странники, покорившие Разлом

                  <th style="padding: 10px 14px;">Время</th>
                  <th style="padding: 10px 14px;">Убийства</th>
                  <th style="padding: 10px 14px; text-align: right;">Очки</th>
                </tr>
              </thead>
              <tbody id="leaderboard-tbody">

              </tbody>
            </table>
          </div>

          <div style="display: flex; justify-content: flex-end; margin-top: 16px;">
            <button id="leaderboard-btn-back" class="action-btn modern-back-btn" style="min-width: 140px;">Назад</button>
          </div>
        </div>
      </div>
