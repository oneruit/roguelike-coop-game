<div id="inventory-modal" class="modal hidden">
  <div class="modal-backdrop in-game-modal-backdrop" id="inventory-backdrop"></div>
  <div class="modal-card inventory-modal-card modern-glass-modal">
    <div class="inventory-modal-header">
      <div class="inventory-title-group">
        <div class="sub-title menu-badge-blue">СНАРЯЖЕНИЕ И АРТЕФАКТЫ</div>
        <h2 class="wild-west-title modern-menu-title" id="inventory-hero-title">ИНВЕНТАРЬ ПЕРСОНАЖА</h2>
      </div>
      <div class="inventory-header-actions" style="display: flex; align-items: center; gap: 10px;">
        <button id="btn-inventory-toggle-stat-mode" class="stat-mode-toggle-btn" type="button" title="Переключить режим отображения характеристик">
          <span class="stat-mode-icon">📊</span>
          <span id="inventory-stat-mode-label">Режим: Базовый (+бонус)</span>
        </button>
        <button id="btn-close-inventory" class="modern-back-btn" type="button" title="Закрыть [ESC] / [I]">[X] ЗАКРЫТЬ [I]</button>
      </div>
    </div>

    <div class="inventory-modal-content">
      <!-- Left Panel: Hero Stats & Passives -->
      <div class="inventory-col inventory-left-panel">
        <div class="inventory-card-section">
          <div class="inventory-section-heading">
            <span class="inventory-heading-icon">👤</span>
            <span>ХАРАКТЕРИСТИКИ</span>
          </div>
          <div id="inventory-stats-list" class="inventory-stats-table">
            <!-- Populated dynamically -->
          </div>
        </div>

        <div class="inventory-card-section">
          <div class="inventory-section-heading">
            <span class="inventory-heading-icon">⭐</span>
            <span>ПАССИВНЫЕ УСИЛЕНИЯ</span>
          </div>
          <div id="inventory-passives-list" class="inventory-passives-list">
            <!-- Populated dynamically -->
          </div>
        </div>
      </div>

      <!-- Right Panel: Weapons & Rift Items -->
      <div class="inventory-col inventory-right-panel">
        <div class="inventory-card-section">
          <div class="inventory-section-heading">
            <span class="inventory-heading-icon">⚔️</span>
            <span>ОРУЖИЕ И УЛУЧШЕНИЯ</span>
          </div>
          <div id="inventory-weapons-list" class="inventory-weapons-list">
            <!-- Populated dynamically -->
          </div>
        </div>

        <div class="inventory-card-section">
          <div class="inventory-section-heading">
            <span class="inventory-heading-icon">💎</span>
            <span>ПРЕДМЕТЫ РАЗЛОМА</span>
          </div>
          <div id="inventory-items-list" class="inventory-items-grid">
            <!-- Populated dynamically -->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
