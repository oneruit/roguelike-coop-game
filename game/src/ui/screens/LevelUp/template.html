<div id="level-up-modal" class="modal hidden">
  <div class="modal-backdrop in-game-modal-backdrop"></div>
  <div class="modal-card level-up-card select-character-card modern-glass-modal">
    <div class="modal-header">
      <div id="level-up-step-indicator" class="sub-title menu-badge-yellow">ПОВЫШЕНИЕ УРОВНЯ</div>
      <h2 id="level-up-title" class="wild-west-title modern-menu-title">ВЫБЕРИТЕ ОРУЖИЕ</h2>
    </div>
    <div id="upgrade-cards" class="upgrade-grid">
      <!-- Dynamically populated cards -->

      </button>
    </div>
  </div>
