name: Auto PR & Auto-Merge

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'chore/**'
      - 'docs/**'
      - 'test/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pr:
    name: Auto-Create PR and Queue Auto-Merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-create PR & queue auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          echo "Target branch: $BRANCH -> $DEFAULT_BRANCH"

          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "Default branch detected, skipping."
            exit 0
          fi

          EXISTING_PR=$(gh pr list --head "$BRANCH" --base "$DEFAULT_BRANCH" --json number --jq '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            COMMIT_TITLE=$(git log -1 --pretty=%s)
            COMMIT_BODY=$(git log -1 --pretty=%b)
            echo "Creating Pull Request..."
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH" \
              --title "$COMMIT_TITLE" \
              --body "### Automated Pull Request
Branch: \`$BRANCH\`
Pushed by: \`${{ github.actor }}\`

$COMMIT_BODY

---
*Created automatically. Configured for auto-merge if checks pass with zero conflicts.*"
          else
            echo "PR #$EXISTING_PR already exists."
          fi

          echo "Enabling auto-merge..."
          gh pr merge "$BRANCH" --auto --merge || gh pr merge "$BRANCH" --auto --squash || echo "Auto-merge queueing finished or requires repository setting activation."
