name: Auto PR (Fallback)

# NOTE: This workflow is the FALLBACK mechanism.
# The primary PR creation is performed by the agent locally via `gh pr create`.
# This workflow triggers automatically on push to agent branches in case
# the agent's local `gh` command failed or was skipped.
#
# Auto-merge is intentionally DISABLED. All PRs require manual review
# and approval by the developer before merging into development.

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'chore/**'
      - 'docs/**'
      - 'test/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pr:
    name: Auto-Create PR (No Auto-Merge)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-create PR (review required)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          TARGET_BRANCH="development"

          echo "Branch: $BRANCH → $TARGET_BRANCH"

          if [ "$BRANCH" = "$TARGET_BRANCH" ]; then
            echo "Default branch detected, skipping."
            exit 0
          fi

          # Check if PR already exists (created by the agent locally)
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base "$TARGET_BRANCH" --json number --jq '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            echo "No existing PR found — creating fallback PR..."

            COMMIT_TITLE=$(git log -1 --pretty=%s)
            COMMIT_BODY=$(git log -1 --pretty=%b)

            # Build a rich PR body with full commit list
            COMMIT_LOG=$(git log origin/"$TARGET_BRANCH"..HEAD --pretty=format:"- \`%h\` %s" 2>/dev/null | head -20)

            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$BRANCH" \
              --title "$COMMIT_TITLE" \
              --body "### Automated Pull Request (Fallback via GitHub Actions)
          **Branch:** \`$BRANCH\`
          **Pushed by:** \`${{ github.actor }}\`

          $COMMIT_BODY

          #### Commits in this PR
          $COMMIT_LOG

          ---
          *Created automatically by the fallback workflow. The agent's local \`gh pr create\` was not executed or failed.*
          *⚠️ This PR requires manual review and approval before merging.*"

            echo "✅ PR created. Awaiting manual review by the developer."
          else
            echo "PR #$EXISTING_PR already exists (created by agent). Skipping PR creation."
          fi

          # Auto-merge is intentionally NOT enabled.
          # The developer must review and merge this PR manually.
