name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Type check (TypeScript)
        run: npm run typecheck

      - name: Build client production bundle
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PEERJS_HOST: ${{ secrets.VITE_PEERJS_HOST || vars.VITE_PEERJS_HOST }}
          VITE_PEERJS_PORT: ${{ secrets.VITE_PEERJS_PORT || vars.VITE_PEERJS_PORT }}
          VITE_PEERJS_PATH: ${{ secrets.VITE_PEERJS_PATH || vars.VITE_PEERJS_PATH }}
          VITE_PEERJS_KEY: ${{ secrets.VITE_PEERJS_KEY || vars.VITE_PEERJS_KEY }}
          VITE_TURN_HOST: ${{ secrets.VITE_TURN_HOST || vars.VITE_TURN_HOST }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME || vars.VITE_TURN_USERNAME }}
          VITE_TURN_PASSWORD: ${{ secrets.VITE_TURN_PASSWORD || vars.VITE_TURN_PASSWORD }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
